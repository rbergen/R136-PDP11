; SIMH configuration for running R136 on 2.11BSD.
;
; Normally you get here through ./run.sh, which builds the tape image first.
; To start the simulator by hand:   pdp11 r136.ini
; See README.md in this directory for the whole procedure.

; An 11/70 with the maximum amount of memory and a floating point processor.
; "idle" keeps the simulator from burning a host core while 2.11BSD is waiting
; for something to happen.
set cpu 11/70 4096K fpp idle
set clk 60hz

; Let the console pass all eight bits, so the game's box drawing survives.
set tto 8b

; The system disk. ./setup.sh downloads it if you don't have it yet.
set rq enable
set rq0 rauser=1000
att rq0 2.11BSD_rq.dsk

; The tape drive we use to move R136 onto the machine. ./run.sh builds the
; tape before starting us. Attaching one that does not exist yet is harmless:
; you get a blank tape.
set tq enable
att tq0 r136.tap

; The DZ11 serial multiplexer. R136 itself only ever uses the console, but the
; disk image's /etc/ttys starts a getty on each of the DZ's eight lines, and if
; the device isn't there those gettys fail and syslog says so on the console
; every few minutes. Giving the machine the DZ it expects is the cure. The
; vector matters: 2.11BSD looks for it at 310, and SIMH defaults to 300.
set dz enable
set dz lines=8
set dz vector=310

; Nothing is connected to those lines, so nobody can log in over them. To use a
; terminal emulator instead of the console window, add "att dz 4000" here and
; "telnet localhost 4000" once the simulator is running.

; The PiDP-11 front panel lives here in the distribution this image comes from.
; It needs a real panel to talk to, so it stays off.
set xu disable

boot rq0
